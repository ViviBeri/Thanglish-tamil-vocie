name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project scaffold
        run: flutter create --platforms=android app

      - name: Copy app code into scaffold
        run: cp app_flutter_lib/main.dart app/lib/main.dart

      - name: Add dependencies
        working-directory: app
        run: flutter pub add http just_audio path_provider dio

      - name: Add Android permissions
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <application|' app/android/app/src/main/AndroidManifest.xml

      - name: Fix Kotlin version
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.0"/' app/android/settings.gradle

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
